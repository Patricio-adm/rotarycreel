<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Socios - Rotary Club Creel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; text-transform: uppercase; font-size: 13px; }
        .navbar-rotary { background-color: #17458F; border-bottom: 4px solid #F7A81B; }
        .table-socios th { background-color: #17458F; color: white; font-size: 11px; white-space: nowrap; }
        .table-socios td { font-size: 12px; vertical-align: middle; }
        .foto-socio { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 2px solid #17458F; }
        .foto-placeholder { width: 50px; height: 50px; background: #e8eef9; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .modal-header-rotary { background-color: #17458F; color: white; }
        .btn-rotary { background-color: #17458F; color: white; }
        .btn-rotary:hover { background-color: #0f326b; color: white; }
        .info-label { font-weight: 700; color: #17458F; font-size: 11px; }
        .info-value { font-size: 12px; color: #000; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-rotary px-4 mb-3 shadow-sm py-2">
    <a class="navbar-brand fw-bold fs-6" href="/menu">Rotary Club Creel - Distrito 4110</a>
    <div class="d-flex align-items-center">
        <span class="text-white me-2 small d-none d-md-block">{{ session.get('username') }} ({{ session.get('rol') }})</span>
        <button class="btn btn-warning btn-sm shadow-sm fw-bold text-dark me-2 py-1 px-3" data-bs-toggle="modal" data-bs-target="#modalFestividades">🎉 CUMPLEAÑOS: {{ mes_actual_nombre }}</button>
        <a href="/menu" class="btn btn-outline-light btn-sm me-2">Menú</a>
        <a href="/logout" class="btn btn-light btn-sm">Salir</a>
    </div>
</nav>
<div class="container-fluid px-4">
